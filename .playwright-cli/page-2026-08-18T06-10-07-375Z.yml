            - generic [ref=e59]:
              - button "NVIDIA Corporation (NVDA) 10-K · Feb 24, 2023 · ITEM 7. MANAGEMENT'S DISCUSSION AND ANALYSIS OF FINANCIAL CONDITION AND RESULTS OF OPERATIONS" [active] [ref=e60]:
