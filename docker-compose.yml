services:
  backend:
    build: ./backend
    container_name: doccopilot_backend
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OPENAI_EMBEDDING_DIMENSIONS=${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      - OPENAI_CHAT_MODEL=${OPENAI_CHAT_MODEL:-gpt-4o}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.doccopilot-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.doccopilot-api.entrypoints=websecure"
      - "traefik.http.routers.doccopilot-api.tls.certresolver=myresolver"
      - "traefik.http.services.doccopilot-api.loadbalancer.server.port=8000"
    networks:
      - proxy_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    container_name: doccopilot_frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.doccopilot-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.doccopilot-web.entrypoints=websecure"
      - "traefik.http.routers.doccopilot-web.tls.certresolver=myresolver"
      - "traefik.http.services.doccopilot-web.loadbalancer.server.port=80"
    networks:
      - proxy_public
    depends_on:
      backend:
        condition: service_healthy

networks:
  proxy_public:
    external: true
